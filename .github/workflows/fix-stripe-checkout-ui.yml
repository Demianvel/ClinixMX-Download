name: Fix Stripe checkout UI
on:
  push:
    paths: ['.github/workflows/fix-stripe-checkout-ui.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove misleading production-server message
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('El checkout está preparado, pero el servidor privado de facturación todavía no está publicado en producción','Pago con Stripe')
          s=s.replace('El checkout est\\u00e1 preparado, pero el servidor privado de facturaci\\u00f3n todav\\u00eda no est\\u00e1 publicado en producci\\u00f3n','Pago con Stripe')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/fix-stripe-checkout-ui.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-stripe-checkout-ui.yml
          git commit -m 'Fix Stripe checkout message' || exit 0
          git push
